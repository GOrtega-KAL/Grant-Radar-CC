[project]
name = "grant-radar"
version = "0.1.0"
description = "Aplicacion para monitorizar y analizar convocatorias de subvenciones"
authors = [
    {name = "Guillermo Ortega"}
]
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "feedparser (>=6.0.12,<7.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "anthropic (>=0.118.0,<0.119.0)",
    "pydantic (>=2.13.0,<3.0.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "pypdf (>=6.0,<7.0)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
